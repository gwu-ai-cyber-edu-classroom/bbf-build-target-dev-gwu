<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}File upload + preview{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">📁 upload + preview</a>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    <small>BBF target #18 — files are served as text or download only, never as HTML.</small>
  </footer>
</body>
</html>
